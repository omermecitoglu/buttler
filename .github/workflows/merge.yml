name: Merge alpha to main

on:
  schedule:
    - cron: "59 16 * * *" # 23:59 WIB (UTC+7)

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge alpha into main
        run: |
          git checkout main
          git merge origin/alpha
          git push origin main
