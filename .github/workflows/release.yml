name: Release
on:
  push:
    branches:
      # - main
      - alpha
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # for Creating tags and releases
      issues: write # for Editing issue content, Commenting on issues, Closing issues
      pull-requests: write # for Commenting on PRs, Merging or closing PRs
      id-token: write # for publishing to NPM
      # packages: write # for publishing to GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
        # run: npm test

      # - name: Upload results to Codecov
        # uses: codecov/codecov-action@v4
        # with:
          # token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create database
        run: npm run build:migration

      - name: Build package
        run: npm run build

      # Installs the package like a user does. The command fails if the server doesn't work.
      - name: Check package
        env:
          BUTTLER_HOME: ${{ runner.temp }}/buttler-home
          BUTTLER_DB_PATH: ${{ runner.temp }}/buttler-home/database.sqlite
          # The check doesn't need containers
          DOCKER_HOST: unix:///nonexistent.sock
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/buttler" "$RUNNER_TEMP"/*.tgz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/buttler/bin/buttler" start || { cat "$BUTTLER_HOME/buttler.log"; exit 1; }
          "$RUNNER_TEMP/buttler/bin/buttler" stop

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
